// This file gets executed every time you start Dune Strike.

// This is where you should put any scripts you may have created for AC.

// In-game voice chat (on by default; F9 turns it off):
//   F9  toggles voice chat on/off (you get an on-screen confirmation)
//   X   hold to talk (push-to-talk), release to stop
// If you prefer different keys, change them here or with "bind" in the console.
bind F9 togglevoice
bind X [ voiceon; onrelease voiceoff ]

// Movement and actions (CS 1.6 standard controls):
bind W forward
bind S backward
bind A left
bind D right
bind R reload
bind SPACE jump
bind LCTRL crouch
bind C crouch
bind E bombaction
bind F bombaction

// Weapon switching keys (CS 1.6 / CS2 standard):
bind 1 primary
bind 2 secondary
bind 3 melee
bind 4 grenades
bind Q key_prevweapon
bind B key_showmenuweapons
bind TAB key_showscores
bind MOUSE1 attack
bind MOUSE2 altaction
bind MOUSE4 key_universaldelta_plus
bind MOUSE5 key_universaldelta_minus
