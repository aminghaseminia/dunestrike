name: build & release (Dune Strike)

# Builds Dune Strike for Linux (native), Windows 32-bit (mingw cross-compile,
# compatible with bin_win32 DLLs) and macOS (arm64), then attaches the three
# game archives to a GitHub release.
#
# Trigger:
#  - push to main   → rebuild and update the versioned release automatically
#  - push a tag v*  → build that exact version
#  - manual run     → build the typed version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Game version (e.g. 1.4.0.0) — a v<version> tag will be created'
        required: true
        default: '1.4.0.0'
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Output archive names are assembled as DuneStrike_v<ver>_<plat>.<ext>
  ACTIONS_ALLOW_UNSECURE_COMMANDS: false

jobs:
  # ------------------------------------------------------------- metadata ---
  meta:
    runs-on: ubuntu-latest
    name: Release metadata
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            N=$(grep -m1 '^[[:space:]]*#define DS_VERSION' source/src/cube.h | awk '{print $3}' | tr -d '-')
            VER="${N:0:1}.${N:1:1}.${N:2:1}.${N:3:1}"
            test -n "$VER" || { echo "could not read DS_VERSION from cube.h"; exit 1; }
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
  # ---------------------------------------------------------------- Linux ---
  build-linux:
    needs: meta
    runs-on: ubuntu-22.04
    name: Linux x64
    steps:
      - uses: actions/checkout@v4

      - name: Enable production build
        run: sed -i 's@//#define PRODUCTION@#define PRODUCTION@' source/src/cube.h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang g++ make libsdl2-dev libsdl2-image-dev libopenal-dev \
            libvorbis-dev libx11-dev zlib1g-dev

      - name: Build client + server
        run: |
          cd source/enet
          ./configure --enable-shared=no --enable-static=yes
          make -j4
          cd ../src
          make -j4 client server
          file dunestrike_client dunestrike_server
          install -d ../../bin_unix
          install -m755 dunestrike_client ../../bin_unix/dunestrike_client
          install -m755 dunestrike_server ../../bin_unix/dunestrike_server

      - name: Package game archive (tar.gz)
        run: |
          VER="${{ needs.meta.outputs.version }}"
          TAR="DuneStrike_v${VER}_Linux.tar.gz"
          git archive --format=tar.gz -o "$TAR" HEAD
          # re-pack adding the built binaries (bin_unix is git-ignored)
          cd /tmp && rm -rf ds-pack && mkdir ds-pack && cd ds-pack
          tar xzf "$GITHUB_WORKSPACE/$TAR"
          rm -rf ./bin_unix
          cp -R "$GITHUB_WORKSPACE/bin_unix" ./bin_unix
          tar czf "$GITHUB_WORKSPACE/$TAR" .
          echo "TAR=$TAR" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: DuneStrike_v*_Linux.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------- Windows ---
  build-windows:
    needs: meta
    runs-on: ubuntu-22.04
    name: Windows 32-bit (mingw cross)
    steps:
      - uses: actions/checkout@v4

      - name: Enable production build
        run: sed -i 's@//#define PRODUCTION@#define PRODUCTION@' source/src/cube.h

      - name: Install mingw cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make g++-mingw-w64-i686-posix mingw-w64-tools

      - name: Build client + server
        run: |
          # POST-WORKFLOW-FIX: -rdynamic is Linux-only; force added via Makefile override
          sed -i 's/ -rdynamic//' source/src/Makefile
          cd source/enet
          ./configure --host=i686-w64-mingw32 --enable-shared=no --enable-static=yes
          make -j4
          cd ../src
          make -j4 client server \
            PLATFORM=MINGW \
            CXX=i686-w64-mingw32-g++ \
            WINDRES=i686-w64-mingw32-windres \
            'CXXFLAGS=-O3 -fomit-frame-pointer -Wall -fsigned-char' \
            'CLIENT_LIBS=-mwindows -L../enet/.libs -lenet -L../lib -lSDL2main -lSDL2 -lSDL2_image -lvorbisfile -lzdll -lopengl32 -lOpenAL32 -lws2_32 -lwinmm -static-libgcc -static-libstdc++' \
            'SERVER_LIBS=-L../enet/.libs -lenet -L../lib -lzdll -lSDL2 -lws2_32 -lwinmm -static-libgcc -static-libstdc++'
          file ../../bin_win32/dunestrike_client.exe ../../bin_win32/dunestrike_server.exe

      - name: Package game archive (zip)
        run: |
          VER="${{ needs.meta.outputs.version }}"
          ZIP="DuneStrike_v${VER}_Windows.zip"
          git archive --format=zip -o "$ZIP" HEAD
          cd /tmp && rm -rf ds-pack && mkdir ds-pack && cd ds-pack
          unzip -q "$GITHUB_WORKSPACE/$ZIP"
          cp "$GITHUB_WORKSPACE/bin_win32/dunestrike_client.exe" ./bin_win32/
          cp "$GITHUB_WORKSPACE/bin_win32/dunestrike_server.exe" ./bin_win32/
          # MinGW runtime DLLs the client still imports (libstdc++ is static).
          for f in libgcc_s_dw2-1.dll libwinpthread-1.dll; do
            p=$(find /usr -name "$f" | head -1)
            test -n "$p" || { echo "missing $f"; exit 1; }
            cp "$p" ./bin_win32/
          done
          zip -qr "$GITHUB_WORKSPACE/$ZIP" .
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: DuneStrike_v*_Windows.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS ---
  build-macos:
    needs: meta
    runs-on: macos-latest
    name: macOS arm64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v4

      - name: Enable production build
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            sed -i '' -e 's@//#define PRODUCTION@#define PRODUCTION@' source/src/cube.h
          else
            sed -i 's@//#define PRODUCTION@#define PRODUCTION@' source/src/cube.h
          fi

      - name: Install dependencies
        run: |
          brew install sdl2 sdl2_image libvorbis automake autoconf libtool pkg-config dylibbundler

      - name: Build client + server
        run: |
          cd source/enet
          ./configure --enable-shared=no --enable-static=yes
          make -j4
          cd ../src
          SDL_CFLAGS="$(sdl2-config --cflags)"
          SDL_LIBS="$(sdl2-config --libs)"
          make -j4 client server \
            CXX=clang++ \
            "CLIENT_LIBS=-L../enet/.libs -lenet $SDL_LIBS -lSDL2_image -lvorbisfile -lz -framework OpenGL -framework OpenAL -framework AudioToolbox" \
            "SERVER_INCLUDES=-DSTANDALONE -I. -Ibot -I../enet/include $SDL_CFLAGS" \
            "SERVER_LIBS=-L../enet/.libs -lenet $SDL_LIBS -lz"
          file dunestrike_client dunestrike_server
          install -d ../../bin_unix
          install -m755 dunestrike_client ../../bin_unix/dunestrike_client
          install -m755 dunestrike_server ../../bin_unix/dunestrike_server

      - name: Bundle macOS libraries
        run: |
          dylibbundler -od -b \
            -x bin_unix/dunestrike_client \
            -x bin_unix/dunestrike_server \
            -d bin_unix/libs \
            -p @executable_path/libs

      - name: Package game archive (zip)
        run: |
          VER="${{ needs.meta.outputs.version }}"
          ZIP="DuneStrike_v${VER}_macOS.zip"
          git archive --format=zip -o "$ZIP" HEAD
          mkdir -p /tmp/ds-pack && rm -rf /tmp/ds-pack/* && cd /tmp/ds-pack
          unzip -q "$GITHUB_WORKSPACE/$ZIP"
          rm -rf ./bin_unix
          cp -R "$GITHUB_WORKSPACE/bin_unix" ./bin_unix
          zip -qr "$GITHUB_WORKSPACE/$ZIP" .
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-archive
          path: DuneStrike_v*_macOS.zip
          if-no-files-found: error

  # -------------------------------------------------------------- Release ---
  release:
    needs: [meta, build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    name: Publish release
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          pattern: '*-archive'
          path: dist

      - name: Create/upload release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          # A build from main moves the versioned tag to that commit, so the
          # release always contains binaries built from the latest main. The
          # tag push made with GITHUB_TOKEN does not trigger another workflow.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "$TAG"
          fi
          # workflow_dispatch: make sure the tag exists at the selected commit
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "$TAG"
            fi
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Dune Strike $TAG" \
              --verify-tag \
              --generate-notes
          else
            gh release edit "$TAG" --title "Dune Strike $TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
          BODY="Automated build from commit $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC')."$'\n\n'"**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/$TAG"
          gh release edit "$TAG" --notes "$BODY"
